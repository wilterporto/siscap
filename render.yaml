services:
  - type: web
    name: siscap-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:app' --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      # O DATABASE_URL deve ser preenchido manualmente no painel do Render
      # com a URL fornecida pelo Neon.tech
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1

<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Senha - SISCAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: #f5f5f5;
            background-size: cover;
            background-position: center;
        }

        .form-signin {
            max-width: 400px;
            padding: 30px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <main class="form-signin text-center w-100">
        <form method="POST">
            <h1 class="h3 mb-3 fw-normal text-primary"><i class="bi bi-shield-lock-fill me-2"></i>Recuperar Senha</h1>
            <p class="text-muted mb-4 small">Informe seu e-mail cadastrado para receber uma nova senha.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show"
                role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com"
                    required>
                <label for="email">E-mail Cadastrado</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-3" type="submit">Enviar Nova Senha</button>
            <a href="{{ url_for('login') }}" class="text-decoration-none text-muted">Voltar para o Login</a>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
